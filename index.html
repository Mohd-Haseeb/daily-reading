<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daily Reading</title>
<style>
:root{--bg:#fafaf7;--fg:#1c1c1a;--mut:#6b6b66;--card:#fff;--bd:#e4e3dc;--ac:#2b5fd9;--ok:#2e7d4f}
@media(prefers-color-scheme:dark){:root{--bg:#141413;--fg:#ecebe6;--mut:#9a9992;--card:#1d1d1b;--bd:#2f2f2c;--ac:#7aa2ff;--ok:#5fc08a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{border-bottom:1px solid var(--bd);padding:14px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;position:sticky;top:0;background:var(--bg);z-index:5}
header h1{font-size:18px;margin:0;margin-right:auto}
select,input[type=search]{background:var(--card);color:var(--fg);border:1px solid var(--bd);border-radius:8px;padding:7px 10px;font:inherit;font-size:14px}
main{max-width:820px;margin:0 auto;padding:20px}
.layout{display:grid;grid-template-columns:200px 1fr;gap:24px}
@media(max-width:760px){.layout{grid-template-columns:1fr}}
nav#days{max-height:80vh;overflow:auto;font-size:14px}
nav#days button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--mut);padding:6px 8px;border-radius:6px;cursor:pointer;font:inherit}
nav#days button.on,nav#days button:hover{background:var(--card);color:var(--fg)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:18px 20px;margin-bottom:16px}
.card.done{opacity:.55}
.tag{display:inline-block;font-size:12px;color:var(--ac);border:1px solid var(--bd);border-radius:20px;padding:1px 10px;margin-right:6px}
.card h2{font-size:18px;margin:8px 0 2px}
.card h2 a{color:var(--fg);text-decoration:none}
.card h2 a:hover{color:var(--ac);text-decoration:underline}
.src{color:var(--mut);font-size:13px}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:14px 0 4px}
p{margin:0 0 8px;white-space:pre-wrap}
.ex{border-left:3px solid var(--ac);padding-left:12px}
.focus{border-color:var(--ac)}
label.chk{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:14px;color:var(--mut);cursor:pointer}
.empty{color:var(--mut);text-align:center;padding:60px 0}
.date{font-size:22px;margin:0 0 14px}
</style>
</head>
<body>
<header>
<h1>Daily Reading</h1>
<input id="q" type="search" placeholder="Search all days…">
<select id="area"><option value="">All areas</option></select>
<select id="st"><option value="">All</option><option value="todo">Unread</option><option value="done">Read</option></select>
</header>
<main><div class="layout"><nav id="days"></nav><section id="view"></section></div></main>
<script>
(function(){
'use strict';
var $=function(i){return document.getElementById(i)};
var days=[],cache={},cur=null;
var store={get:function(){try{return JSON.parse(localStorage.getItem('dr_done')||'{}')}catch(e){return{}}},set:function(o){try{localStorage.setItem('dr_done',JSON.stringify(o))}catch(e){}}};
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function safe(u){return /^https?:\/\//i.test(u||'')?u:'#'}
function load(d){if(cache[d])return Promise.resolve(cache[d]);return fetch('data/entries/'+d+'.json',{cache:'no-cache'}).then(function(r){return r.json()}).then(function(j){cache[d]=j;return j})}
function key(d,i){return d+'#'+i}
function card(d,it,i,focus){
 var done=store.get(),c=el('article','card'+(done[key(d,i)]?' done':'')+(focus?' focus':''));
 if(it.area)c.appendChild(el('span','tag',it.area));
 if(focus)c.appendChild(el('span','tag','Focus of the day'));
 var h=el('h2'),a=el('a',null,it.title);a.href=safe(it.url);a.target='_blank';a.rel='noopener noreferrer';h.appendChild(a);c.appendChild(h);
 if(it.source)c.appendChild(el('div','src',it.source));
 [['why','Why it matters'],['summary','Key ideas'],['exercise','Implement it']].forEach(function(f){
  if(!it[f[0]])return;c.appendChild(el('h3',null,f[1]));c.appendChild(el('p',f[0]==='exercise'?'ex':'',it[f[0]]));});
 var l=el('label','chk'),cb=document.createElement('input');cb.type='checkbox';cb.checked=!!done[key(d,i)];
 cb.onchange=function(){var s=store.get();if(cb.checked)s[key(d,i)]=1;else delete s[key(d,i)];store.set(s);c.classList.toggle('done',cb.checked)};
 l.appendChild(cb);l.appendChild(document.createTextNode('Read / done'));c.appendChild(l);
 return c}
function pass(d,it,i){
 var a=$('area').value,s=$('st').value,q=$('q').value.toLowerCase(),done=store.get()[key(d,i)];
 if(a&&it.area!==a)return false;if(s==='done'&&!done)return false;if(s==='todo'&&done)return false;
 if(q&&JSON.stringify(it).toLowerCase().indexOf(q)<0)return false;return true}
function render(){
 var v=$('view');v.textContent='';
 if(!days.length){v.appendChild(el('div','empty','The first digest arrives soon.'));return}
 var q=$('q').value;
 if(q){
  Promise.all(days.map(function(d){return load(d.date)})).then(function(all){
   v.textContent='';var n=0;
   all.forEach(function(e){(e.items||[]).forEach(function(it,i){if(pass(e.date,it,i)){n++;v.appendChild(el('div','src',e.date));v.appendChild(card(e.date,it,i,false))}})});
   if(!n)v.appendChild(el('div','empty','No matches.'))});return}
 load(cur).then(function(e){
  v.textContent='';v.appendChild(el('h1','date',e.date));
  var n=0;(e.items||[]).forEach(function(it,i){if(pass(e.date,it,i)){n++;v.appendChild(card(e.date,it,i,e.focus===it.title||e.focus===i))}});
  if(!n)v.appendChild(el('div','empty','Nothing here with these filters.'))})}
function nav(){
 var n=$('days');n.textContent='';
 days.forEach(function(d){var b=el('button',d.date===cur?'on':'',d.date);b.onclick=function(){cur=d.date;$('q').value='';nav();render()};n.appendChild(b)})}
fetch('data/index.json',{cache:'no-cache'}).then(function(r){return r.json()}).then(function(j){
 days=(j.days||[]).sort(function(a,b){return a.date<b.date?1:-1});
 var areas={};days.forEach(function(d){(d.areas||[]).forEach(function(a){areas[a]=1})});
 Object.keys(areas).sort().forEach(function(a){var o=el('option',null,a);o.value=a;$('area').appendChild(o)});
 cur=days.length?days[0].date:null;nav();render()}).catch(function(){days=[];render()});
['q','area','st'].forEach(function(i){$(i).addEventListener('input',render)});
})();
</script>
</body>
</html>
